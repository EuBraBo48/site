const frames=data.map(s=>{let i=new Image();i.src='data:image/jpeg;base64,'+s;return i});
const regions=[{x:175,y:325,w:570,h:590,r:20},{x:298,y:777,w:616,h:314,r:62}];
let selected=0,photo=null,zoom=1,dx=0,dy=0;const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),z=document.getElementById('zoom');
const opts=document.getElementById('options');frames.forEach((im,n)=>{let b=document.createElement('button');b.className='option'+(n===0?' active':'');b.innerHTML='<img alt="Moldura '+(n+1)+'" src="'+im.src+'"><div>Moldura '+(n+1)+'</div>';b.onclick=()=>{selected=n;document.querySelectorAll('.option').forEach((v,j)=>v.classList.toggle('active',j===n));zoom=1;dx=dy=0;z.value=1;draw()};opts.append(b);im.onload=draw});
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip()}
function draw(){let f=frames[selected];if(!f.complete||!f.naturalWidth)return;canvas.width=f.naturalWidth;canvas.height=f.naturalHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(f,0,0);if(photo){let a=regions[selected];ctx.save();rounded(a.x,a.y,a.w,a.h,a.r);let scale=Math.max(a.w/photo.width,a.h/photo.height)*zoom,w=photo.width*scale,h=photo.height*scale;ctx.drawImage(photo,a.x+(a.w-w)/2+dx,a.y+(a.h-h)/2+dy,w,h);ctx.restore();ctx.save();ctx.strokeStyle='#ffffff';ctx.lineWidth=7;ctx.beginPath();ctx.roundRect(a.x,a.y,a.w,a.h,a.r);ctx.stroke();ctx.restore()}}
